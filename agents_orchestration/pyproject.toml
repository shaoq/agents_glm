[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agents-orchestration"
version = "0.1.0"
description = "Local-first durable orchestration runtime for intelligent research and task execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
agents-orchestration = "agents_orchestration.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_orchestration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "unit: deterministic unit tests",
    "integration: integration tests across modules and SQLite",
    "contract: capability contract tests shared by Fake and real adapters",
    "architecture: import/layering boundary tests",
    "e2e: end-to-end research run tests",
    "smoke: optional live adapter tests, explicitly enabled",
]

[tool.coverage.run]
branch = true
source = ["agents_orchestration"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
