<rect x="640" y="988" width="50" height="22" rx="5" ry="5" fill="#dcfce7" stroke="#059669" stroke-width="1.6"/>
<rect x="696" y="988" width="50" height="22" rx="5" ry="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
<text x="715" y="1028" font-size="0.1" fill="#fff">.</text>
<text x="755" y="1003" font-size="12.5" fill="#0f172a">终态：SUCCEEDED / FAILED</text>
<text x="80" y="1058" font-size="12.5" font-weight="700" fill="#6d28d9">💡 HINT 规律</text>
<text x="80" y="1080" font-size="11.5" fill="#334155">只有「补研究（回 RESEARCHING）」需要 HINT — 告诉系统「缺什么证据」。改报告/重规划/澄清都不需要（不产新 research task）。</text>
<text x="80" y="1100" font-size="11.5" fill="#334155">两层 gap 共享 Focused Replan：ANALYZE（自动，sufficiency 不足）+ REVIEW（人 resolve 后）。HINT 经 sanitize_gap → 标签 block → 不能加 capability（untrusted）。</text>
<text x="80" y="1120" font-size="11" fill="#64748b">注：NORMALIZING 模糊 &amp; REVIEW RESEARCH_GAP 经 Gate；ANALYZE 的 gap 自动 Focused Replan（无需人）。</text>
